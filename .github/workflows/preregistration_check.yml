name: Research and safety guards

on:
  push:
    paths:
      - "research/**.md"
      - "data/hypothesis_ledger.jsonl"
      - "scripts/**.py"
      - "agent/tests/**.py"
  pull_request:
    paths:
      - "research/**.md"
      - "data/hypothesis_ledger.jsonl"
      - "scripts/**.py"
      - "agent/tests/**.py"

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install guard test dependency
        run: python -m pip install "pytest>=7.0"
      - run: python scripts/precommit_research_guard.py
      - run: python scripts/secret_leak_guard.py
      - run: python -m pytest agent/tests/test_preregistration_validator.py agent/tests/test_hypothesis_ledger.py agent/tests/test_promotion_gate.py agent/tests/test_safety_chaos.py -q
